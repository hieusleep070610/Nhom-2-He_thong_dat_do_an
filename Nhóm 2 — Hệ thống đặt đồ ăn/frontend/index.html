<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodPay - Hệ Thống Đặt Đồ Ăn & Ví Điện Tử</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header & Hệ thống kiểm tra -->
        <header class="card">
            <h1>FoodPay Dashboard</h1>
            <div class="status-bar">
                <span>Trạng thái kết nối:</span>
                <span id="db-status" class="badge badge-warning">Đang kết nối...</span>
            </div>
        </header>

        <!-- Thẻ thông tin Ví tiền -->
        <section class="card">
            <h2>Quản Lý Ví Điện Tử</h2>
            <div class="wallet-info">
                <div class="info-item">
                    <span class="label">Mã Ví (ID):</span>
                    <strong id="wallet-id">--</strong>
                </div>
                <div class="info-item">
                    <span class="label">Mã Người Dùng:</span>
                    <strong id="user-id">--</strong>
                </div>
                <div class="info-item">
                    <span class="label">Số Dư (VND):</span>
                    <strong id="balance-amount" class="text-success">0 ₫</strong>
                </div>
                <div class="info-item">
                    <span class="label">Số Xu Tích Lũy:</span>
                    <strong id="xu-amount" class="text-warning">0 Xu</strong>
                </div>
            </div>

            <!-- Form thao tác nhanh -->
            <div class="form-group">
                <h3>Tra Cứu Ví</h3>
                <div class="input-inline">
                    <input type="number" id="input-wallet-id" placeholder="Nhập ID Ví (vd: 1)" min="1">
                    <button id="btn-fetch-wallet" onclick="fetchWallet()">Tải Thông Tin</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";

        // Kiểm tra kết nối Backend & MySQL
        async function checkHealth() {
            const statusEl = document.getElementById("db-status");
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                if (data.status === "ok" && data.db === "connected") {
                    statusEl.textContent = "Hoạt động (DB Connected)";
                    statusEl.className = "badge badge-success";
                } else {
                    statusEl.textContent = "Lỗi kết nối DB";
                    statusEl.className = "badge badge-danger";
                }
            } catch (err) {
                statusEl.textContent = "Server chưa chạy";
                statusEl.className = "badge badge-danger";
            }
        }

        // Đọc thông tin Ví từ API /api/wallets/{id}
        async function fetchWallet() {
            const walletId = document.getElementById("input-wallet-id").value;
            if (!walletId) {
                alert("Vui lòng nhập ID ví!");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/wallets/${walletId}`);
                if (!res.ok) {
                    throw new Error("Không tìm thấy ví hoặc lỗi hệ thống");
                }
                const data = await res.json();
                
                document.getElementById("wallet-id").textContent = data.id;
                document.getElementById("user-id").textContent = data.user_id;
                document.getElementById("balance-amount").textContent = data.balance.toLocaleString('vi-VN') + " ₫";
                document.getElementById("xu-amount").textContent = data.xu + " Xu";
            } catch (err) {
                alert(err.message);
            }
        }

        // Tự động kiểm tra sức khỏe hệ thống khi nạp trang
        checkHealth();
    </script>
</body>
</html>
